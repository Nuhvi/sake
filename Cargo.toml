[package]
name = "sake"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Script Army Knife Emulator"
repository = "https://github.com/Nuhvi/sake"
license = "MIT"
keywords = ["bitcoin", "script", "tapscript", "covenants"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
bitcoin = { version = "0.32.5", features = ["rand-std"] }

[dev-dependencies]
proptest = "1.9.0"

bitcoin-script = { git = "https://github.com/Bitcoin-Wildlife-Sanctuary/rust-bitcoin-script", tag = "1.0.0" }

# test vectors
serde_json = "1.0.146"
bitcoin = { version = "=0.32.5", features = [ "serde" ] }
hex = "0.4.3"
serde = "1.0.228"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "deny"
unused_must_use = "deny"
# `forbid` is not possible yet: BIP-348 verifies messages of any length.
# rust-bitcoin 0.32 pins secp256k1 0.29, and its safe API accepts only 32-byte
# messages. `verify_schnorr_bytes` allows the one FFI call. Change this to
# `forbid` after rust-bitcoin moves to secp256k1 0.30 or later.
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
# groups
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }

# pedantic = { level = "warn", priority = -1 }

# restriction
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"

# Duplicate versions come from the dev-dependencies.
multiple_crate_versions = "allow"
